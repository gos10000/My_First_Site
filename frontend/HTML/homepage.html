<!DOCTYPE HTML>
<html lang="zh-CH">
    <header>
        <title>用户登录</title>
    </header>
    <body>
        <div class="page_main">
            <div class="login">
                <form class="login_form">
                    <div class="login_username">
                        <label>用户名</label>
                        <input type="text" name="username">
                    </div>
                    <div class="login_key">
                        <label>密码</label>
                        <input type="password" name="key">
                    </div>
                    <div class="confirm_botton">
                        <button type="submit">登录</button>
                    </div>
                </form>
            </div>
            <div class="page_bottom">
                <a href="">注册</a>
                <a href="">忘记密码</a>
            </div>
        </div>
    </body>
</html>
